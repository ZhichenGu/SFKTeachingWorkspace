<body>
<header><div class="brand"><span class="mark" aria-hidden="true">课</span><div><div class="eyebrow">TEACHING WORKSPACE</div><h1>学生上课签单</h1></div></div><p>课后记录</p><button class="mobile-preview" type="button" data-action="preview">预览</button></header>
<main class="layout" hidden>
<form id="record-form" novalidate>
<section class="section" aria-labelledby="basic-title"><h2 id="basic-title"><span class="num">01</span>课程信息</h2><div class="grid">
<div class="wide" id="course-field"><label for="courseName">课程名称</label><select id="courseName" name="courseName"><option value="项目课">项目课</option><option value="基础/软件课">基础/软件课</option></select></div>
<div><label for="lessonDate">上课日期</label><input id="lessonDate" name="lessonDate" type="date"></div>
<div><label for="lessonNumber">第几次课</label><input id="lessonNumber" name="lessonNumber" type="number" min="1" max="999" step="1" inputmode="numeric" placeholder="例如：3"></div>
<div><label for="checkIn">Check in · 开始时间</label><select id="checkIn" name="checkIn"></select></div>
<div><label for="checkOut">Check out · 结束时间</label><select id="checkOut" name="checkOut"></select></div></div>
<p class="hint" id="timeHint">每 30 分钟一档，可展开选择。</p>
</section>
<section class="section" aria-labelledby="notes-title"><h2 id="notes-title"><span class="num">02</span>课堂与作业</h2>
<label for="content">上课内容</label><textarea id="content" name="content" placeholder="记录本节课的主题、完成的工作与学生进展…"></textarea>
<label for="homework" style="margin-top:20px">课后作业</label><textarea id="homework" name="homework" placeholder="写下需要完成的任务、要求与下次课前的准备…"></textarea>
<fieldset style="margin-top:22px"><legend>上节课作业是否按时按量完成</legend><div class="choices"><label class="choice"><input type="radio" name="previousHomework" value="yes">是，已完成</label><label class="choice"><input type="radio" name="previousHomework" value="no">否，未完成</label><button type="button" id="unset-homework">暂不填写</button></div></fieldset>
</section>
<section class="section" aria-labelledby="sign-title"><h2 id="sign-title"><span class="num">03</span>签名确认</h2><div id="signature-editors"></div><p class="hint">姓名使用设备自带楷体 / 手写字体，效果随设备变化。需要保留真实笔迹时，请使用图片或画笔。</p></section>
</form>
<aside class="preview" aria-labelledby="preview-title"><div class="preview-title"><h2 id="preview-title">签单预览</h2><span class="badge">A4 · 纵向</span></div><div class="paper-wrap"><div class="paper" id="live-paper"></div></div><div class="actions"><button type="button" data-action="preview">放大预览</button><button type="button" class="primary" data-action="print">打印 / 保存 PDF</button></div><div class="actions"><button type="button" data-action="png">下载 PNG 图片</button></div><p class="hint">所有填写与签名仅在本页处理，未上传。关闭或刷新前请导出。打印时选择 A4、100% 比例并关闭页眉页脚。</p><div id="export-status" class="message" role="status" aria-live="polite"></div><div id="export-review" class="warning" hidden><div id="review-message"></div><div class="actions"><button type="button" id="continue-export">保留空项并导出</button><button type="button" id="dismiss-review">返回填写</button></div></div></aside>
</main>
<dialog id="preview-dialog" aria-labelledby="dialog-title"><div class="dialog-bar"><strong id="dialog-title">1对1课程记录表</strong><button type="button" id="close-preview">关闭预览</button></div><div class="paper dialog-paper" id="large-paper"></div></dialog>
<div class="print-root" id="print-paper"></div>
<script>
'use strict';
/* DATA MODEL v1. Keep user data separate from editors and document layout.
 * previousHomework: null | 'yes' | 'no'; time strings use local wall time.
 * Each signature retains independent drafts; ONLY its active mode is exported.
 * Drawing coordinates are normalized to [0,1], so resize never loses ink.
 */
const blankSignature=()=>({mode:'text',text:'',image:null,strokes:[],loading:false,revision:0});

function initialRecord(now=new Date()){

  const end=Math.min(1410,Math.max(30,Math.round((now.getHours()*60+now.getMinutes())/30)*30));
  return {schemaVersion:1,courseName:'项目课',lessonDate:dateLocal(now),lessonNumber:'',checkIn:clockText(Math.max(0,end-60)),checkOut:clockText(end),content:'',homework:'',previousHomework:null,teacherName:'',signatures:{student:blankSignature(),mentor:blankSignature()}};
}

box.querySelector('[data-clear]').onclick=()=>{if(s.mode==='text'){s.text='';$(role+'-name').value='';box.querySelector('[data-name-preview]').textContent='';}else if(s.mode==='image'){s.revision++;s.loading=false;s.image=null;$(role+'-file').value='';box.querySelector('[data-image-preview]').textContent='尚未添加图片';}else{s.strokes=[];activeStroke=null;draw();}clearReview();render();};signatureViews[role]={draw};}
mountSignature('student','学生签名');mountSignature('mentor','导师签名');
// EXPORT: one validation boundary; blank fields are warnings, never preview gates.
const signaturePresent=s=>s.mode==='text'?!!s.text.trim():s.mode==='image'?!!s.image:s.strokes.length>0;
function validateExport(){const errors=[],missing=[];for(const [key,label] of Object.entries({courseName:'课程名称',lessonDate:'上课日期',lessonNumber:'第几次课',checkIn:'开始时间',checkOut:'结束时间',content:'上课内容',homework:'课后作业',previousHomework:'上节课作业完成情况'}))if(!String(state[key]??'').trim())missing.push(label);for(const [key,label] of [['student','学生签名'],['mentor','导师签名']]){const s=state.signatures[key];if(s.mode==='image'&&s.loading)errors.push(label+'图片仍在处理');if(!signaturePresent(s))missing.push(label);}if(state.lessonNumber&&(!Number.isInteger(+state.lessonNumber)||+state.lessonNumber<1||+state.lessonNumber>999))errors.push('课次请填写 1–999 的整数');if(state.checkIn&&state.checkIn===state.checkOut)errors.push('开始与结束时间不能相同');errors.push(...currentDocument.overflow.map(x=>x+'超出 A4 可容纳范围，请缩短文字或减少空行'));return {errors,missing};}
let pendingExport=null;function clearReview(){$('export-review').hidden=true;pendingExport=null;setStatus('');}
function requestExport(kind){render();const {errors,missing}=validateExport();clearReview();if(errors.length){setStatus(errors.join('；'));return;}if(missing.length){pendingExport=kind;$('review-message').textContent='以下内容尚未填写：'+missing.join('、')+'。可返回补充，也可以保留空项导出。';$('export-review').hidden=false;$('export-review').scrollIntoView({block:'nearest',behavior:'smooth'});return;}performExport(kind);}
$('continue-export').onclick=()=>{const kind=pendingExport;clearReview();if(kind)performExport(kind);};$('dismiss-review').onclick=clearReview;
async function performExport(kind){const svg=currentDocument.svg;const buttons=[...document.querySelectorAll('[data-action="png"],[data-action="print"]')];try{buttons.forEach(b=>b.disabled=true);await document.fonts.ready;if(kind==='print'){$('print-paper').innerHTML=svg;await Promise.all([...$('print-paper').querySelectorAll('image')].map(el=>new Promise(resolve=>{const i=new Image();i.onload=i.onerror=resolve;i.src=el.getAttribute('href');})));window.print();setStatus('打印窗口已打开；选择“另存为 PDF”即可保存。');}else{setStatus('正在生成高清图片…');const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));try{const img=new Image();img.src=url;await img.decode();const c=document.createElement('canvas');c.width=1588;c.height=2246;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)throw Error('图片生成失败');const link=document.createElement('a'),download=URL.createObjectURL(blob);link.href=download;link.download=`学生上课签单_${state.lessonDate||'未填日期'}.png`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(download),60000);setStatus('PNG 图片已生成并发起下载。');}finally{URL.revokeObjectURL(url);}}}catch(err){setStatus('导出未完成：'+err.message+'。可以改用浏览器打印 / 保存 PDF。');}finally{buttons.forEach(b=>b.disabled=false);}}
document.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=()=>{if(btn.dataset.action==='preview'){render();$('large-paper').innerHTML=currentDocument.svg;$('preview-dialog').showModal();}else requestExport(btn.dataset.action);});$('close-preview').onclick=()=>$('preview-dialog').close();window.addEventListener('beforeprint',render);window.addEventListener('beforeunload',e=>{if(window.SFKHasUnsavedChanges?.()){e.preventDefault();e.returnValue='';}});
render();
</script>
